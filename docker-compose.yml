services:
  api:
    image: python:3.11-slim
    container_name: rag_agent_api
    volumes:
      - .:/app
    working_dir: /app
    ports:
      - "8000:8000"
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:v1.9.1
    container_name: rag_agent_vector_db
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Agent Chat</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f7f7f8; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #ffffff; padding: 1rem; border-bottom: 1px solid #e5e5e5; text-align: center; font-weight: bold; font-size: 1.1rem; }
        #chat-container { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; max-width: 800px; width: 100%; margin: 0 auto; box-sizing: border-box; }
        .message { padding: 0.8rem 1.2rem; border-radius: 8px; max-width: 75%; line-height: 1.5; word-wrap: break-word; }
        .user { background: #007bff; color: white; align-self: flex-end; }
        .assistant { background: #e5e5ea; color: black; align-self: flex-start; }
        #input-container { background: #ffffff; padding: 1rem; border-top: 1px solid #e5e5e5; display: flex; justify-content: center; }
        #form { display: flex; max-width: 800px; width: 100%; gap: 0.5rem; }
        #question-input { flex: 1; padding: 0.8rem; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; outline: none; }
        #send-btn { padding: 0.8rem 1.5rem; background: #007bff; color: white; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
        #send-btn:hover { background: #0056b3; }
    </style>
</head>
<body>
    <header>RAG Agent Chat</header>
    <div id="chat-container">
        <div class="message assistant">Hello! Type your question below to query the RAG system.</div>
    </div>
    <div id="input-container">
        <form id="form">
            <input type="text" id="question-input" placeholder="Type your question here..." autocomplete="off" required>
            <button type="submit" id="send-btn">Send</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('form');
        const input = document.getElementById('question-input');
        const chatContainer = document.getElementById('chat-container');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const question = input.value.trim();
            if (!question) return;

            // Append user message
            appendMessage(question, 'user');
            input.value = '';

            // Send request to FastAPI backend
            try {
                const response = await fetch('/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question, limit: 3 })
                });

                if (!response.ok) {
                    throw new Error('Failed to fetch response from server.');
                }

                const data = await response.json();
                // Adjust depending on how your /query endpoint formats the response
                const answer = data.answer || data.response || JSON.stringify(data, null, 2);
                appendMessage(answer, 'assistant');
            } catch (error) {
                appendMessage('Error: Could not connect to the RAG backend.', 'assistant');
            }
        });

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.textContent = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
